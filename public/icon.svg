<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- Background with rounded corners for standard & maskable display -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  
  <!-- Outer Gold Border -->
  <circle cx="256" cy="256" r="195" fill="none" stroke="url(#gold)" stroke-width="8" stroke-dasharray="16 10" opacity="0.45"/>
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#gold)" stroke-width="4" opacity="0.8"/>
  
  <!-- Central Emblem Shield / Coin -->
  <g filter="url(#shadow)">
    <!-- Shield Background -->
    <path d="M256 95 L370 145 V260 C370 340 320 405 256 425 C192 405 142 340 142 260 V145 Z" fill="#0f172a" stroke="url(#gold)" stroke-width="6"/>
    <!-- Inner Accent -->
    <path d="M256 115 L352 158 V255 C352 322 310 380 256 398 C202 380 160 322 160 255 V158 Z" fill="#1e293b" opacity="0.7"/>
    
    <!-- Stylized Monogram P and Growth Sprout -->
    <text x="238" y="295" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="160" text-anchor="middle" fill="url(#gold)">P</text>
    
    <!-- Growth plant symbol on the right of P representing AGR (Activités Génératrices de Revenus) -->
    <path d="M295 240 Q330 210 340 170 Q305 175 285 205 Q285 235 295 240 Z" fill="#22c55e"/>
    <path d="M295 235 Q300 280 345 285 Q335 250 305 240 Z" fill="#16a34a"/>
  </g>
  
  <!-- Subtitle Text -->
  <text x="256" y="475" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="4" text-anchor="middle" fill="#f8fafc">DOSSO • NIGER</text>
</svg>
